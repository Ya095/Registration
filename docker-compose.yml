services:

  pg:
    image: postgres
    container_name: pg
    env_file:
      - registration_app/.env
#    restart: always
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data

  app:
    container_name: app
    build:
      context: .
      dockerfile: Dockerfile
    command: ["registration_app/docker_run.sh"]
    ports:
      - "8000:8000"
    depends_on:
      - pg

  prometheus:
    image: prom/prometheus:v2.43.0
    container_name: prometheus
#    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "9090:9090"
    depends_on:
      - app

  grafana:
    image: grafana/grafana:8.5.22
    container_name: grafana
    ports:
      - "3000:3000"
#    restart: always
    user: "0"
    volumes:
      - grafana-data:/var/lib/grafana
      - grafana-config:/etc/grafana
    depends_on:
      - prometheus

volumes:
  pg-data:
  grafana-data:
  grafana-config:
  prometheus-data: